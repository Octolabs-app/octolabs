name: Validate games
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  octoflag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check octoflag/app.mjs
      - run: node --test tests/octoflag*.test.mjs
      - run: npm ci --prefix cloudflare/octoflag
      - run: npm test --prefix cloudflare/octoflag
