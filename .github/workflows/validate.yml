name: Validate games
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  octoflag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check octocross/app.mjs
      - run: node --test tests/octocross.test.mjs tests/daily.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/octolabs-dom" --ignore-scripts --no-audit --no-fund linkedom@0.18.13
      - run: node --test tests/octocross-ui.cjs tests/home-discovery.test.mjs tests/game-navigation.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/octolabs-dom/node_modules
      - run: node scripts/build-crosswords.mjs
      - run: git diff --exit-code -- octocross/catalog.json octocross/validation.json
      - run: node --check octopairs/app.mjs
      - run: node --test tests/octopairs.test.mjs octohome/tests/model.test.cjs
      - run: node --check octoflag/app.mjs
      - run: node --test tests/octoflag*.test.mjs
      - run: npm ci --prefix cloudflare/octoflag
      - run: npm test --prefix cloudflare/octoflag
