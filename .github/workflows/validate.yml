name: Validate games
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  octoflag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check octogarage/app.mjs && node --check octogarage/viewer.mjs && node --check octogarage/cars.mjs
      - run: node --test octogarage/tests/*.test.mjs
      - run: node --check octocross/app.mjs
      - run: node --check platform/progress.mjs && node --check platform/hub.mjs && node --check daily-numbers/app.mjs
      - run: node --test tests/platform-progress.test.mjs tests/daily-numbers.test.mjs tests/cross-daily.test.mjs
      - run: node --test tests/octocross.test.mjs
      - run: npm install --prefix "$RUNNER_TEMP/octolabs-dom" --ignore-scripts --no-audit --no-fund linkedom@0.18.13
      - run: node --test tests/octocross-ui.cjs tests/home-discovery.test.mjs tests/game-navigation.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/octolabs-dom/node_modules
      - run: node scripts/build-crosswords.mjs
      - run: git diff --exit-code -- octocross/catalog.json octocross/validation.json
      - run: node --test octohome/tests/model.test.cjs
      - run: node --check octoflag/app.mjs
      - run: node --test tests/octoflag*.test.mjs
      - run: npm ci --prefix cloudflare/octoflag
      - run: npm test --prefix cloudflare/octoflag
