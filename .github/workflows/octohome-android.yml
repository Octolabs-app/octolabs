name: OctoHome Android
on:
  push:
    branches: [main]
    paths: ['octohome/**', '.github/workflows/octohome-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octohome-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test octohome/tests/model.test.cjs
      - run: node --check octohome/design.js
      - run: node --check functions/octohome/api/prices.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 octohome/android/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: octohome-android-0.2.0
          path: octohome/android/build/octohome-0.2.0.apk
          if-no-files-found: error
          retention-days: 30
