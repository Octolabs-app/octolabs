name: Octolabs Android development APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/octolabs-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/octolabs-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: octolabs-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 android/build.py
      - name: Verify packaged identity and permissions
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/build/octolabs-0.1.0-dev.apk > android/build/apk-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('android/build/apk-badging.txt').read_text()
          assert "package: name='app.octolabs.games'" in text
          assert "versionName='0.1.0-dev'" in text
          assert "sdkVersion:'26'" in text
          permissions = [line for line in text.splitlines() if line.startswith('uses-permission:')]
          assert permissions == ["uses-permission: name='android.permission.INTERNET'"], permissions
          print('Packaged identity, minimum SDK and INTERNET-only permission verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: octolabs-android-0.1.0-dev
          path: |
            android/build/octolabs-0.1.0-dev.apk
            android/build/octolabs-0.1.0-dev.apk.sha256
            android/build/build-metadata.json
            android/build/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
