<svg xmlns="http://www.w3.org/2000/svg" class="eight sad" viewBox="0 0 240 240" role="img" aria-label="Friendly eight: sad"><title>Eight — sad</title><style>
.eight-body{transform-origin:120px 120px}.eyes{transform-origin:120px 75px}.spark{transform-origin:120px 120px}.sparkles,.sweat{opacity:0}
.idle .eight-body{animation:wobble 5s ease-in-out infinite}.idle .eyes{animation:blink 5s infinite}
.thinking .pupils{transform:translateY(-5px)}.thinking .spark{animation:pulse 1.4s ease-in-out infinite}
.happy .eight-body{animation:bounce 1.8s ease-in-out infinite}.happy .loop{filter:drop-shadow(0 0 6px #fff8)}.happy .sparkles{opacity:1;animation:pulse 1.8s infinite}
.panic .eight-body{animation:shake .35s ease-in-out infinite}.panic .sweat{opacity:1}.panic .pupils{transform:scale(.8);transform-origin:120px 76px}
.sad .eight-body{transform:translateY(12px) scaleY(.9)}.sad .pupils{transform:translateY(5px)}
.win .eight-body{animation:infinity 5s ease-in-out infinite}.win .sparkles{opacity:1}.loading .top{animation:filltop 2.4s ease-in-out infinite}.loading .bottom{animation:fillbottom 2.4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(2px) scaleY(.97)}}@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes infinity{0%,10%{transform:rotate(0)}30%,48%{transform:rotate(90deg)}70%,100%{transform:rotate(360deg)}}@keyframes filltop{0%,100%{opacity:.25}30%,75%{opacity:1}}@keyframes fillbottom{0%,25%,100%{opacity:.25}55%,75%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.win .eight-body{transform:rotate(90deg)}.sparkles{opacity:1}}
</style><g class="eight-body"><ellipse class="loop top" cx="120" cy="73" rx="47" ry="41" fill="none" stroke="#ffe899" stroke-width="28"/><ellipse class="loop bottom" cx="120" cy="166" rx="54" ry="46" fill="none" stroke="#89ecd7" stroke-width="28"/><path class="spark" d="M120 103 L125 115 L138 120 L125 125 L120 137 L115 125 L102 120 L115 115Z" fill="#8b7bc1" style="filter:drop-shadow(0 0 5px #8b7bc199)"/><g class="eyes"><g fill="#eef0fb"><ellipse cx="103" cy="75" rx="10" ry="12"/><ellipse cx="137" cy="75" rx="10" ry="12"/></g><g class="pupils" fill="#10172b"><circle cx="104" cy="77" r="5"/><circle cx="138" cy="77" r="5"/></g></g><g fill="none" stroke="#eef0fb" stroke-width="5" stroke-linecap="round"><path d="M109 175 Q120 161 131 175"/></g><path class="sweat" d="M187 71 Q172 96 187 96 Q201 96 187 71" fill="#89ecd7"/></g><g class="sparkles" fill="#e6d8ff"><path d="M35 39L39 49L49 53L39 57L35 67L31 57L21 53L31 49Z"/><path d="M202 158L206 168L216 172L206 176L202 186L198 176L188 172L198 168Z"/></g></svg>